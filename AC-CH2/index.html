<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Coming Soon</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;
    overflow:hidden;

}

body{

    background:
    radial-gradient(circle at center,
    rgba(255,180,40,.18) 0%,
    rgba(90,50,0,.12) 28%,
    #040404 70%,
    #010101 100%);

    font-family:
    Consolas,
    monospace;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#ffeec2;

    position:relative;

}

/* ------------------------ */
/* SCANLINES */
/* ------------------------ */

.scanlines{

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:.08;

    background:

    repeating-linear-gradient(

        180deg,

        transparent 0px,

        transparent 3px,

        rgba(255,255,255,.4) 4px

    );

}

/* ------------------------ */
/* HUD */
/* ------------------------ */

.hud{

    position:relative;

    width:min(960px,90vw);

    height:min(620px,88vh);

    border:

    2px solid

    rgba(255,235,190,.95);

    background:

    rgba(12,10,8,.45);

    box-shadow:

    0 0 10px rgba(255,180,60,.15),

    0 0 35px rgba(255,180,60,.08),

    inset 0 0 35px rgba(255,170,50,.04);

}

/* ------------------------ */
/* HEADER */
/* ------------------------ */

.header{

    height:78px;

    border-bottom:

    2px solid

    rgba(255,235,190,.9);

    display:flex;

    align-items:center;

    padding-left:28px;

    font-size:44px;

    letter-spacing:8px;

    font-weight:bold;

    color:#fff3d4;

    text-shadow:

    0 0 6px #ffd765,

    0 0 18px rgba(255,210,80,.5);

}

/* ------------------------ */
/* CONTENT */
/* ------------------------ */

.content{

    position:absolute;

    inset:78px 0 0 0;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

}

/* ------------------------ */
/* SOLVER ICON */
/* ------------------------ */

.iconBox{

    width:240px;

    height:240px;

    display:flex;

    justify-content:center;

    align-items:center;

}

#solver{

    width:180px;

    user-select:none;

    pointer-events:none;

    filter:

    brightness(1.2)

    saturate(1.35)

    drop-shadow(0 0 8px #ffd34d)

    drop-shadow(0 0 20px #ffc62a)

    drop-shadow(0 0 45px rgba(255,205,70,.8));

    transition:

    transform .45s,

    opacity .35s,

    filter .35s;

}

/* ------------------------ */
/* TITLE */
/* ------------------------ */

.title{

    margin-top:22px;

    font-size:60px;

    letter-spacing:10px;

    color:#fff7d8;

    text-shadow:

    0 0 10px #ffd95d,

    0 0 24px #ffc82e,

    0 0 60px rgba(255,205,70,.85);

}

/* ------------------------ */
/* COMMAND */
/* ------------------------ */

.command{

    margin-top:18px;

    color:#ffd85d;

    font-size:18px;

    letter-spacing:3px;

    text-shadow:

    0 0 8px #ffd44c,

    0 0 16px #ffcb2c,

    0 0 35px rgba(255,205,70,.75);

}

/* --- continuing from Part 1 --- */

/* Corner brackets */
.bracket{
  position:absolute;width:28px;height:28px;
  border-color:rgba(255,220,140,.95);
  border-style:solid;pointer-events:none;z-index:10;
}
.bracket.tl{top:6px;left:6px;border-width:3px 0 0 3px}
.bracket.tr{top:6px;right:6px;border-width:3px 3px 0 0}
.bracket.bl{bottom:6px;left:6px;border-width:0 0 3px 3px}
.bracket.br{bottom:6px;right:6px;border-width:0 3px 3px 0}

/* Status bar at the bottom */
.statusBar{
  position:absolute;bottom:0;left:0;right:0;height:58px;
  border-top:2px solid rgba(255,235,190,.75);
  display:flex;align-items:center;padding:0 22px;gap:18px;
  background:rgba(0,0,0,.25);
}
.statusLabel{
  font-size:13px;letter-spacing:2px;color:#ffd85d;
  text-shadow:0 0 6px #ffc82e;white-space:nowrap;
}
.progressTrack{
  flex:1;height:8px;
  background:rgba(255,200,80,.12);
  border:1px solid rgba(255,220,140,.45);
  overflow:hidden;
}
.progressFill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#ffb020,#ffe070,#ffb020);
  box-shadow:0 0 12px #ffc82e;
  transition:width .25s linear;
}
.percent{
  font-size:13px;letter-spacing:1px;color:#ffe9a8;min-width:42px;text-align:right;
}

/* Decorative rotating ring behind the icon */
.ring{
  position:absolute;width:200px;height:200px;
  border:1px solid rgba(255,210,90,.25);
  border-radius:50%;
  animation:spin 18s linear infinite;
  pointer-events:none;
}
.ring::before{
  content:"";position:absolute;inset:-6px;
  border:1px dashed rgba(255,200,70,.18);
  border-radius:50%;
  animation:spin 28s linear infinite reverse;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Flash transition class */
#solver.flash{
  opacity:0;
  transform:scale(1.18) rotate(8deg);
  filter:brightness(2.4) saturate(1.8)
    drop-shadow(0 0 20px #fff)
    drop-shadow(0 0 50px #ffd34d);
}
.command.fade{opacity:0}

/* Soft HUD pulse */
@keyframes hudPulse{
  0%,100%{box-shadow:0 0 12px rgba(255,180,55,.18),0 0 40px rgba(255,175,40,.09),inset 0 0 40px rgba(255,165,40,.05)}
  50%{box-shadow:0 0 18px rgba(255,190,60,.28),0 0 55px rgba(255,180,50,.14),inset 0 0 50px rgba(255,170,45,.08)}
}
.hud{animation:hudPulse 4.5s ease-in-out infinite}

</style>
</head>
<body>

<div class="scanlines"></div>

<div class="hud">
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div class="header">COMING SOON</div>

  <div class="content">
    <div class="iconBox">
      <div class="ring"></div>
      <img id="solver" src="AS_1.png" alt="Absolute Solver">
    </div>
    <div class="title">ABSOLUTE SOLVER</div>
    <div class="command" id="cmd">cmd//:absoluteSolver_translate</div>
  </div>

  <div class="statusBar">
    <div class="statusLabel">INITIALIZING</div>
    <div class="progressTrack"><div class="progressFill" id="bar"></div></div>
    <div class="percent" id="pct">0%</div>
  </div>
</div>

<script>
const icons = [
  {src:"AS_1.png", cmd:"cmd//:absoluteSolver_translate"},
  {src:"AS_2.png", cmd:"cmd//:absoluteSolver_scale"},
  {src:"AS_3.png", cmd:"cmd//:absoluteSolver_rotate"},
  {src:"AS_4.png", cmd:"cmd//:absoluteSolver_edit"}
];

const solver = document.getElementById("solver");
const cmdEl  = document.getElementById("cmd");
const bar    = document.getElementById("bar");
const pct    = document.getElementById("pct");

const ROTATE_MS = 16500;   // change this to make each icon stay longer/shorter
const FLASH_MS  = 420;
let index = 0;
let startTime = performance.now();

function updateProgress(now){
  const elapsed = (now - startTime) % ROTATE_MS;
  const p = Math.min(100, (elapsed / ROTATE_MS) * 100);
  bar.style.width = p + "%";
  pct.textContent = Math.floor(p) + "%";
}

function switchIcon(){
  solver.classList.add("flash");
  cmdEl.classList.add("fade");

  setTimeout(()=>{
    index = (index + 1) % icons.length;
    solver.src = icons[index].src;
    cmdEl.textContent = icons[index].cmd;

    startTime = performance.now();
    bar.style.width = "0%";
    pct.textContent = "0%";

    requestAnimationFrame(()=>{
      solver.classList.remove("flash");
      cmdEl.classList.remove("fade");
    });
  }, FLASH_MS);
}

function loop(now){
  updateProgress(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

setInterval(switchIcon, ROTATE_MS);

// Preload the other three images
icons.forEach(i => { const img = new Image(); img.src = i.src; });
</script>
</body>
</html>
